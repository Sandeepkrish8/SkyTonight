<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Telescope Stand/Tripod -->
  <path d="M100 130 L80 190" stroke="#7C5CFF" stroke-width="6" stroke-linecap="round" />
  <path d="M100 130 L120 190" stroke="#22D3EE" stroke-width="6" stroke-linecap="round" />
  <path d="M100 130 L100 190" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" />
  
  <!-- Mount -->
  <circle cx="100" cy="120" r="10" fill="#1a1b26" stroke="#ffffff" stroke-width="3" />
  
  <!-- Main Telescope Tube -->
  <g transform="rotate(-30 100 100)">
    <!-- Main Body -->
    <rect x="40" y="85" width="120" height="30" rx="4" fill="url(#gradTelescope)" stroke="#ffffff" stroke-width="2" />
    
    <!-- Lens Hood / Front End -->
    <rect x="155" y="80" width="15" height="40" rx="2" fill="#22D3EE" />
    
    <!-- Eyepiece section (back) -->
    <rect x="25" y="92" width="15" height="16" fill="#7C5CFF" />
    
    <!-- Little Finderscope -->
    <rect x="70" y="75" width="40" height="6" rx="3" fill="#ffffff" />
    <path d="M80 81 L80 85 M100 81 L100 85" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Gradient Defs -->
  <defs>
    <linearGradient id="gradTelescope" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b26;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2b36;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
